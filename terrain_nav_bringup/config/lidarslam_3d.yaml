scan_matcher:
  ros__parameters:
    global_frame_id: "map"
    robot_frame_id: "base_footprint"
    registration_method: "GICP" # or NDT
    ndt_resolution: 1.0
    ndt_num_threads: 2
    trans_for_mapupdate: 0.5
    rot_for_mapupdate: 0.1
    scan_period: 0.1
    map_publish_period: 5.0
    num_targeted_cloud: 10
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_roll: 0.0
    initial_pose_pitch: 0.0
    initial_pose_yaw: 0.0
    use_odom: true
    debug_flag: false

graph_based_slam:
  ros__parameters:
    registration_method: "GICP"
    ndt_resolution: 1.0
    ndt_num_threads: 2
    voxel_leaf_size: 0.4
    loop_detection_period: 1000 # ms
    threshold_loop_closure_score: 0.5
    distance_loop_closure_score: 1.0
    range_of_searching_loop_closure: 10.0
    search_submap_num: 2
    num_adjacent_pose_to_merge_map: 5
    use_save_map_in_loop: true
    debug_flag: false
